[package]
name = "citerack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "A reference manager that opens large BibTeX libraries without freezing"
default-run = "citerack"

[dependencies]
citerack-bib.workspace = true
citerack-index.workspace = true
citerack-store.workspace = true
egui = "0.32"
egui_extras = "0.32"
# The platform dialog: the AppKit panel on macOS, a COM dialog on Windows, and
# on Linux whichever of the desktop portal or zenity the host offers.
rfd = "0.15"

# The window backend is per platform: the X11 and Wayland paths carry no weight
# on Windows.
[target.'cfg(unix)'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
# eframe asks for wgpu without its backends, so each target names its own: Vulkan
# on Linux, DX12 on Windows, and the GL path both share as the second chance.
[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "25", default-features = false, features = ["gles", "vulkan", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "25", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
wgpu = { version = "25", default-features = false, features = ["dx12", "gles", "wgsl"] }

[dev-dependencies]
accesskit = "0.19"
egui_kittest = { version = "0.32", features = ["eframe"] }
glutin = "0.32"
winit = "0.30"
raw-window-handle = "0.6"
