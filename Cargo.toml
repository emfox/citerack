[workspace]
resolver = "3"
members = [
    "crates/bib",
    "crates/index",
    "crates/store",
    "crates/app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["citerack contributors"]
repository = "https://github.com/emfox/citerack"
publish = false

[workspace.dependencies]
citerack-bib = { path = "crates/bib" }
citerack-index = { path = "crates/index" }
citerack-store = { path = "crates/store" }
memchr = "2.7"
# The HTTP client for an identifier lookup, and the JSON its two services answer
# in. `rustls` is deliberate rather than native TLS: a machine does not have to
# have OpenSSL or winhttp for an import to work.
ureq = { version = "3.5", default-features = false, features = ["rustls", "gzip"] }
serde_json = "1"
