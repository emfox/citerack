name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history checks read every commit, which a shallow clone loses.
          fetch-depth: 0

      # Nothing is installed here on purpose. Every window library this build
      # touches — X11, Wayland, xkbcommon, GL, EGL — is reached through a `dlopen`
      # feature, so no probe runs and no header is read while compiling. Building
      # on a bare runner is a property worth keeping, and `linux-links` in
      # `scripts/check_all.py` checks that the binary still binds only libc, libm
      # and libgcc_s.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # One step per check, so a failure lands on the run page beside the check
      # that produced it rather than inside a summary of nine others.
      - name: policy
        run: python3 scripts/check_all.py --only policy --require-all --verbose

      - name: repo
        run: python3 scripts/check_all.py --only repo --require-all --verbose

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

      - name: perf
        run: cargo test -p citerack-store --release --test budget

  # The Windows exe is linked on Linux, so what it binds is decided here rather than
  # on a machine that would hide a missing import behind the DLL being installed.
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          cargo install cargo-xwin --locked

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the Microsoft CRT and SDK
        run: cargo-xwin cache xwin

      - name: Build
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p citerack

      - name: Check the exe binds only libraries Windows ships
        run: bash scripts/check_windows_imports.sh target/x86_64-pc-windows-msvc/release/citerack.exe
