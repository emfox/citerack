name: release

on:
  push:
    tags: ["v*"]
  # A tag is the only thing that publishes, so a run can be checked first without
  # leaving a draft behind.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Both binaries are built on Linux, which is the host the project is developed
  # on. A Windows job would link with a different toolchain and a different SDK,
  # so what a tag ships and what a checkout builds would not be the same thing.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The window stack links against these; without them the build stops at
      # the first crate that wants a font or a keymap.
      - name: Install the window development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p citerack

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/citerack dist/citerack
          cd dist && sha256sum citerack > citerack.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: citerack-linux
          path: dist/*

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # xwin links with lld and reads the headers with clang, so both come from
      # the host rather than from a Visual Studio installation.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          cargo install cargo-xwin --locked

      - uses: Swatinem/rust-cache@v2

      # The Microsoft CRT and SDK come from a pinned download, so the same
      # revision of this repository links against the same libraries every time.
      - name: Fetch the Microsoft CRT and SDK
        run: cargo-xwin cache xwin

      - name: Build
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p citerack

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/citerack.exe dist/citerack.exe
          cd dist && sha256sum citerack.exe > citerack.exe.sha256

      # The runtime is linked statically by `.cargo/config.toml`. A redistributable
      # that creeps back in would leave the exe unopenable on a machine that never
      # had a compiler, so the build fails here rather than there.
      - name: Check the dependencies are all system libraries
        run: |
          borrowed=$(objdump -p dist/citerack.exe |
            grep -i 'DLL Name' |
            sed 's/.*DLL Name: //' |
            grep -iE '^(VCRUNTIME|MSVCP|api-ms-win-crt|ucrtbase|libgcc|libstdc)')
          if [ -n "$borrowed" ]; then
            echo "The exe needs a runtime the machine may not have:" >&2
            echo "$borrowed" >&2
            exit 1
          fi
          objdump -p dist/citerack.exe | grep -i 'DLL Name' | sed 's/.*DLL Name: //' | sort -u

      - uses: actions/upload-artifact@v4
        with:
          name: citerack-windows
          path: dist/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            Built from ${{ github.sha }} by the release workflow.

            Each binary has a `.sha256` beside it. Verify with:

                sha256sum -c citerack.sha256                     # Linux
                sha256sum -c citerack.exe.sha256                 # Linux or WSL
                Get-FileHash citerack.exe -Algorithm SHA256      # Windows
