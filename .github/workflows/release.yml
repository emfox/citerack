name: release

on:
  push:
    tags: ["v*"]
  # A tag is the only thing that publishes, so a run can be checked first without
  # leaving a draft behind.
  workflow_dispatch:

permissions:
  contents: write

# A tag that is moved and pushed again asks for two builds of the same version, and
# two runs uploading to one release is a race the later one loses. Only the newest
# push of a given tag is allowed to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both binaries are built on Linux, which is the host the project is developed
  # on. A Windows job would link with a different toolchain and a different SDK,
  # so what a tag ships and what a checkout builds would not be the same thing.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The window stack links against these; without them the build stops at
      # the first crate that wants a font or a keymap.
      - name: Install the window development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p citerack

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/citerack dist/citerack
          cd dist && sha256sum citerack > citerack.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: citerack-linux
          path: dist/*

  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # xwin links with lld and reads the headers with clang, so both come from
      # the host rather than from a Visual Studio installation.
      # llvm-objdump rather than binutils: the import table is checked below, and
      # only the LLVM reader agrees with what lld wrote.
      - name: Install the cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          cargo install cargo-xwin --locked

      - uses: Swatinem/rust-cache@v2

      # The Microsoft CRT and SDK come from a pinned download, so the same
      # revision of this repository links against the same libraries every time.
      - name: Fetch the Microsoft CRT and SDK
        run: cargo-xwin cache xwin

      - name: Build
        run: cargo xwin build --release --locked --target x86_64-pc-windows-msvc -p citerack

      - name: Package
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-msvc/release/citerack.exe dist/citerack.exe
          cd dist && sha256sum citerack.exe > citerack.exe.sha256

      # The runtime is linked statically and the shader compiler DX12 needs is
      # delay-loaded, so neither may appear here. The script is shared with CI,
      # which runs it on every push rather than only on a tag.
      - name: Check the exe binds only libraries Windows ships
        run: bash scripts/check_windows_imports.sh dist/citerack.exe

      - uses: actions/upload-artifact@v4
        with:
          name: citerack-windows
          path: dist/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # The notes come from `CHANGELOG.md`, so this job reads the tree too.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Name what will be published
        run: |
          ls -l dist
          # A version section ends at the next one, and the file ends after it.
          awk '/^## /{n++} n==1' CHANGELOG.md |
            sed '1s/^## /# citerack /' > RELEASE.md
          # The notes say what a user gains, which is `CHANGELOG.md` up to its
          # first release; this says which commit built the files and how to check
          # them. Both go in one file because `body` and `body_path` cannot be
          # given together: the action takes the one, silently dropping the other.
          {
            echo
            echo "Built from ${{ github.sha }} by the release workflow."
            echo
            echo 'Each binary has a `.sha256` beside it. Verify with:'
            echo
            echo '    sha256sum -c citerack.sha256                     # Linux'
            echo '    sha256sum -c citerack.exe.sha256                 # Linux or WSL'
            echo '    Get-FileHash citerack.exe -Algorithm SHA256      # Windows'
          } >> RELEASE.md
          head -5 RELEASE.md
          echo ...
          tail -8 RELEASE.md

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: RELEASE.md
